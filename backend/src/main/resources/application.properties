spring.application.name=Distributed

spring.datasource.url=jdbc:mysql://localhost:3306/vote_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=false

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

app.vote.rate-limit-window-ms=1000
app.vote.rate-limit-max-requests=1
app.vote.lock-lease-ms=3000
app.vote.redlock-replicas=5
app.vote.mq-enabled=true
app.vote.mq-exchange=vote.event.exchange
app.vote.mq-routing-key=vote.event
app.vote.mq-queue=vote.event.queue
app.vote.mq-dlx-exchange=vote.event.dlx.exchange
app.vote.mq-dlx-routing-key=vote.event.dlq
app.vote.mq-dlq-queue=vote.event.dlq.queue
app.vote.mq-batch-size=100
app.vote.outbox-batch-size=200
app.vote.outbox-max-retry=20
app.vote.outbox-retry-base-delay=2s
app.vote.outbox-relay-enabled=true
app.vote.outbox-relay-delay-ms=3000
app.vote.idempotent-ttl=7d
app.vote.consumer-enabled=true
app.vote.snapshot-enabled=true
app.vote.snapshot-delay-ms=300000
