spring.application.name=Distributed

spring.datasource.url=jdbc:mysql://localhost:3306/vote_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=123456

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=3000ms

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.tracing.sampling.probability=1.0
management.otlp.tracing.endpoint=http://localhost:4318/v1/traces

app.vote.rate-limit-window-ms=1000
app.vote.rate-limit-max-requests=1
app.vote.lock-lease-ms=3000
app.vote.redlock-replicas=5
app.vote.mq-enabled=true
app.vote.mq-stream-key=vote.event.stream
app.vote.mq-dlq-stream-key=vote.event.dlq.stream
app.vote.mq-consumer-group=vote.event.group
app.vote.mq-consumer-name=vote.event.consumer
app.vote.mq-batch-size=100
app.vote.outbox-batch-size=200
app.vote.outbox-max-retry=20
app.vote.outbox-retry-base-delay=2s
app.vote.outbox-relay-enabled=true
app.vote.outbox-relay-delay-ms=3000
app.vote.consumer-poll-delay-ms=500
app.vote.idempotent-ttl=7d
app.vote.consumer-enabled=true
app.vote.snapshot-enabled=true
app.vote.snapshot-delay-ms=300000
